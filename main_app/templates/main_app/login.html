{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - JSCOE E&TC Department</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,600" rel="stylesheet">

    <!-- Google Recaptcha -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #003366, #0056b3);
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #003366;
        }

        .login-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .forgot-link {
            text-align: right;
            margin-top: 15px;
        }

        .forgot-link a {
            color: #007bff;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
<div class="login-container">
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to your account</p>

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div class="error-message">
                        {{ message }}
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form action="{% url 'user_login' %}" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Email</label>
                <input required type="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input required type="password" name="password" placeholder="Enter your password">
            </div>

            <div class="form-group">
                <div class="g-recaptcha" data-sitekey="6LfswtgZAAAAAJ7bhwqZZtDpBsc75ekH6FWA4Fnt"></div>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="forgot-link">
            <a href="{% url 'password_reset' %}">Forgot Password?</a>
        </div>
    </div>
</div>
</body>
</html>
